[project]
name = "radsurvey-mcp"
version = "0.1.0"
description = "Read-only MCP server that lets AI assistants (GitHub Copilot, Claude) query radiation survey data in plain language."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lada" }]
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
llm = ["anthropic>=0.40"]

[project.scripts]
radsurvey-mcp = "radsurvey_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radsurvey_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
